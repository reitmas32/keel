# One keel instance per organization (e.g. one for Jalo, one for Konectus).
# In Dokploy: create a Compose service, paste this file, set the variables in
# the Environment tab and attach a domain to `keel` on port 3000.

services:
  keel:
    # Published to Docker Hub by keel's release workflow (.github/workflows/release.yml).
    # Pinned so a redeploy never changes version on its own; bump the tag to upgrade.
    image: docker.io/getfoundathyon/keel-api:v0.10.0
    restart: unless-stopped
    environment:
      DOKPLOY_URL: ${DOKPLOY_URL:?URL de tu Dokploy, p.ej. https://dokploy.konectus.internal}
      DOKPLOY_API_KEY: ${DOKPLOY_API_KEY:?API key de Dokploy (Settings → Profile → API/CLI)}
      KEEL_ADMIN_PASSWORD: ${KEEL_ADMIN_PASSWORD:?Contraseña del admin, mínimo 12 caracteres}
      KEEL_CI_EXPIRY_MINUTES: ${KEEL_CI_EXPIRY_MINUTES:-60}
      KEEL_DEPLOY_TIMEOUT_MINUTES: ${KEEL_DEPLOY_TIMEOUT_MINUTES:-15}
      # optional: la API acepta llamadas sin token, con el rol KEEL_ANONYMOUS_ROLE. required: siempre pide token.
      KEEL_API_AUTH: ${KEEL_API_AUTH:-optional}
      KEEL_ANONYMOUS_ROLE: ${KEEL_ANONYMOUS_ROLE:-deployer}
      # Opcionales (v0.10.0). Vacías = valor por defecto o desactivado.
      KEEL_PUBLIC_URL: ${KEEL_PUBLIC_URL:-}
      KEEL_TIMEZONE: ${KEEL_TIMEZONE:-UTC}
      KEEL_APPROVAL_EXPIRY_MINUTES: ${KEEL_APPROVAL_EXPIRY_MINUTES:-1440}
      # Notificaciones: se suman a los canales del admin. Las URLs son secretos.
      KEEL_SLACK_WEBHOOK_URL: ${KEEL_SLACK_WEBHOOK_URL:-}
      KEEL_DISCORD_WEBHOOK_URL: ${KEEL_DISCORD_WEBHOOK_URL:-}
      KEEL_WEBHOOK_URL: ${KEEL_WEBHOOK_URL:-}
      KEEL_WEBHOOK_SECRET: ${KEEL_WEBHOOK_SECRET:-}
      KEEL_NOTIFY_EVENTS: ${KEEL_NOTIFY_EVENTS:-}
      # Métricas en /api/metrics (apagadas sin token) y formato de logs.
      KEEL_METRICS_TOKEN: ${KEEL_METRICS_TOKEN:-}
      KEEL_LOG_FORMAT: ${KEEL_LOG_FORMAT:-json}
      # Base de datos: SQLite en el volumen /data por defecto. Para Postgres (p.ej. varias réplicas de keel),
      # descomenta estas dos líneas y define POSTGRES_DSN en el Environment.
      # DB_ENGINE: postgres
      # POSTGRES_DSN: ${POSTGRES_DSN:?DSN de Postgres, p.ej. postgres://keel:contraseña@postgres:5432/keel}
    # The SQLite database (apps, their scopes, CI tokens and history) lives in keel-data and survives redeploys.
    # keel migrates it on start when you bump the tag (e.g. v0.7.0 renames scopes/services to apps/scopes).
    volumes:
      - keel-data:/data
    expose:
      - "3000"
    # depends_on:
    #   postgres:
    #     condition: service_healthy

  # Opcional: un Postgres junto a keel. Con uno externo (o una base de Dokploy) basta con POSTGRES_DSN.
  # postgres:
  #   image: postgres:17
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: keel
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Contraseña de Postgres}
