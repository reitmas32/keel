# Push a vX.Y.Z tag to publish:
#   - the server image (API + admin + worker) to Docker Hub as <DOCKERHUB_IMAGE>:<tag> and :latest
#   - the CLI tarball as a GitHub Release asset (keel-cli.tgz), installable with
#     npm i -g https://github.com/reitmas32/keel/releases/latest/download/keel-cli.tgz
#
# Repo settings (Settings → Secrets and variables → Actions):
#   Variables → DOCKERHUB_IMAGE     e.g. getfoundathyon/keel-api
#   Secrets   → DOCKERHUB_USERNAME  Docker Hub account that owns the namespace, e.g. getfoundathyon
#   Secrets   → DOCKERHUB_TOKEN     Docker Hub personal access token with Read & Write scope

name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  server-image:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Check Docker Hub settings
        env:
          IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          missing=""
          [ -n "$IMAGE" ] || missing="$missing variable DOCKERHUB_IMAGE,"
          [ -n "$USERNAME" ] || missing="$missing secret DOCKERHUB_USERNAME,"
          [ -n "$TOKEN" ] || missing="$missing secret DOCKERHUB_TOKEN,"
          if [ -n "$missing" ]; then
            echo "::error::Falta configurar en el repo:${missing%,}"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            docker.io/${{ vars.DOCKERHUB_IMAGE }}:${{ github.ref_name }}
            docker.io/${{ vars.DOCKERHUB_IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cli:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pack CLI
        working-directory: apps/cli
        run: |
          npm pkg set version="${GITHUB_REF_NAME#v}"
          pnpm build
          pnpm pack --out ../../keel-cli.tgz
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" keel-cli.tgz --generate-notes
