# Push a vX.Y.Z tag to publish:
#   - the server image (API + admin + worker) to Docker Hub as <DOCKERHUB_IMAGE>:<tag> and :latest
#   - the keel CLI (Rust) for Linux, macOS and Windows (x86_64 and arm64) as GitHub
#     Release assets, plus SHA256SUMS; `keel update` and install.sh/install.ps1 use them
#
# Repo settings (Settings → Secrets and variables → Actions):
#   Variables → DOCKERHUB_IMAGE     e.g. getfoundathyon/keel-api
#   Secrets   → DOCKERHUB_USERNAME  Docker Hub account that owns the namespace, e.g. getfoundathyon
#   Secrets   → DOCKERHUB_TOKEN     Docker Hub personal access token with Read & Write scope

name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  server-image:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Check Docker Hub settings
        env:
          IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          missing=""
          [ -n "$IMAGE" ] || missing="$missing variable DOCKERHUB_IMAGE,"
          [ -n "$USERNAME" ] || missing="$missing secret DOCKERHUB_USERNAME,"
          [ -n "$TOKEN" ] || missing="$missing secret DOCKERHUB_TOKEN,"
          if [ -n "$missing" ]; then
            echo "::error::Falta configurar en el repo:${missing%,}"
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            docker.io/${{ vars.DOCKERHUB_IMAGE }}:${{ github.ref_name }}
            docker.io/${{ vars.DOCKERHUB_IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cli-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  cli-build:
    needs: cli-check
    strategy:
      fail-fast: false
      matrix:
        include:
          # smoke: the runner can execute the binary it just built.
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, musl: true, smoke: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, musl: true, smoke: true }
          - { target: aarch64-apple-darwin, os: macos-latest, smoke: true }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, exe: .exe, smoke: true }
          - { target: aarch64-pc-windows-msvc, os: windows-latest, exe: .exe }
    runs-on: ${{ matrix.os }}
    env:
      KEEL_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }} -p keel
      - name: Name the binary after its target
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/keel${{ matrix.exe }}" "dist/keel-${{ matrix.target }}${{ matrix.exe }}"
      - if: matrix.smoke
        name: Smoke test
        shell: bash
        run: |
          out="$(dist/keel-${{ matrix.target }}${{ matrix.exe }} --version)"
          echo "$out"
          [ "$out" = "keel ${GITHUB_REF_NAME}" ]
      - uses: actions/upload-artifact@v4
        with:
          name: keel-${{ matrix.target }}
          path: dist/*

  release:
    needs: [check, cli-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: keel-*
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum keel-* > SHA256SUMS && cat SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* install.sh install.ps1 --generate-notes
