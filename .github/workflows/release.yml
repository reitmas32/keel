# Push a vX.Y.Z tag to publish:
#   - the server image (API + admin + worker) to Docker Hub as <DOCKERHUB_IMAGE>:<tag> and :latest, for linux/amd64
#     and linux/arm64 (each built and smoke-tested on SQLite and Postgres on a native runner)
#   - the keel CLI (Rust) for Linux, macOS and Windows (x86_64 and arm64) as GitHub
#     Release assets, plus SHA256SUMS; `keel update` and install.sh/install.ps1 use them
#
# Repo settings (Settings → Secrets and variables → Actions):
#   Variables → DOCKERHUB_IMAGE     e.g. getfoundathyon/keel-api
#   Secrets   → DOCKERHUB_USERNAME  Docker Hub account that owns the namespace, e.g. getfoundathyon
#   Secrets   → DOCKERHUB_TOKEN     Docker Hub personal access token with Read & Write scope

name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # Each architecture builds on a native runner (no QEMU), runs the image on SQLite and on Postgres, and pushes it by
  # digest; server-manifest then publishes both under the version tag and :latest.
  server-image:
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include:
          - { platform: linux/amd64, arch: amd64, os: ubuntu-latest }
          - { platform: linux/arm64, arch: arm64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check Docker Hub settings
        env:
          IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          missing=""
          [ -n "$IMAGE" ] || missing="$missing variable DOCKERHUB_IMAGE,"
          [ -n "$USERNAME" ] || missing="$missing secret DOCKERHUB_USERNAME,"
          [ -n "$TOKEN" ] || missing="$missing secret DOCKERHUB_TOKEN,"
          if [ -n "$missing" ]; then
            echo "::error::Falta configurar en el repo:${missing%,}"
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build for the smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: keel-server:smoke
          cache-from: type=gha,scope=server-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=server-${{ matrix.arch }}
      - name: Smoke test (SQLite and Postgres)
        run: .github/scripts/image-smoke.sh keel-server:smoke
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push by digest
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          outputs: type=image,name=docker.io/${{ vars.DOCKERHUB_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=server-${{ matrix.arch }}
      - name: Save the digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: server-digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  server-manifest:
    needs: server-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: digests
          pattern: server-digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish the multi-arch tags
        working-directory: digests
        env:
          IMAGE: docker.io/${{ vars.DOCKERHUB_IMAGE }}
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:$GITHUB_REF_NAME" -t "$IMAGE:latest" \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:$GITHUB_REF_NAME"

  cli-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  cli-build:
    needs: cli-check
    strategy:
      fail-fast: false
      matrix:
        include:
          # smoke: the runner can execute the binary it just built.
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, musl: true, smoke: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, musl: true, smoke: true }
          - { target: aarch64-apple-darwin, os: macos-latest, smoke: true }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, exe: .exe, smoke: true }
          - { target: aarch64-pc-windows-msvc, os: windows-latest, exe: .exe }
    runs-on: ${{ matrix.os }}
    env:
      KEEL_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }} -p keel
      - name: Name the binary after its target
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/keel${{ matrix.exe }}" "dist/keel-${{ matrix.target }}${{ matrix.exe }}"
      - if: matrix.smoke
        name: Smoke test
        shell: bash
        run: |
          out="$(dist/keel-${{ matrix.target }}${{ matrix.exe }} --version)"
          echo "$out"
          [ "$out" = "keel ${GITHUB_REF_NAME}" ]
      - uses: actions/upload-artifact@v4
        with:
          name: keel-${{ matrix.target }}
          path: dist/*

  release:
    needs: [check, cli-build, server-manifest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: keel-*
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum keel-* > SHA256SUMS && cat SHA256SUMS
      - name: Homebrew formula and Scoop manifest
        run: python3 .github/scripts/package_managers.py "$GITHUB_REF_NAME" dist/SHA256SUMS dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* install.sh install.ps1 --generate-notes
      # Optional: with a HOMEBREW_TAP_TOKEN secret (contents: write on reitmas32/homebrew-tap),
      # stable releases update Formula/keel.rb there so `brew install reitmas32/tap/keel` follows them.
      - name: Update the Homebrew tap
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "Sin HOMEBREW_TAP_TOKEN: la fórmula queda solo como asset de la release."
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/reitmas32/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp dist/keel.rb tap/Formula/keel.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/keel.rb
          git diff --cached --quiet || git commit -m "keel ${GITHUB_REF_NAME}"
          git push
